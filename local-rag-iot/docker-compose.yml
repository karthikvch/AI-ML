services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: local-rag-postgres
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpass
    ports:
      - "5434:5432"
    volumes:
      - rag_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  rag_pgdata: